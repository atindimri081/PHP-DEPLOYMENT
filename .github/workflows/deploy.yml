name: Local Linux Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader
        
      - name: Run Database Migrations
        run: php artisan migrate --force